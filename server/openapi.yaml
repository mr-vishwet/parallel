openapi: 3.0.3
info:
  title: PARALLEL sync sketch API
  version: 0.1.0
  description: |
    SKETCH — not a deployed backend. The local-first contract for syncing a
    PARALLEL workspace: projects, branches, append-only snapshots, merges
    and activity events. Implemented in-memory by sync_stub.dart; the
    Flutter client (lib/services/sync_client.dart) speaks this contract.

    Rules the contract enforces:
    - Snapshots are append-only: POSTing an existing snapshot id returns 409.
    - A merge records which changes were applied AND which were left behind,
      plus every conflict resolution. Nothing about a merge is implicit.
    - Auth is a Bearer token; the stub accepts any non-empty token. Real
      auth is a phase-2 item.
servers:
  - url: http://127.0.0.1:8080
    description: Local sketch stub (dart server/sync_stub.dart)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness check (no auth required).
      security: []
      responses:
        '200':
          description: The stub is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: parallel-sync-sketch }
                  version: { type: string, example: 0.1.0 }
                  projects: { type: integer, example: 3 }
  /v1/sync:
    get:
      summary: Pull the whole workspace document the server holds.
      responses:
        '200':
          description: Workspace found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '404':
          description: Nothing stored yet.
    post:
      summary: Push the whole workspace document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace: { $ref: '#/components/schemas/Workspace' }
      responses:
        '201':
          description: Stored (and indexed for the resource endpoints).
  /v1/projects:
    get:
      summary: List the projects the server knows about.
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      summary: Create or replace a project document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Project' }
      responses:
        '201':
          description: Stored.
  /v1/projects/{projectId}:
    get:
      summary: Get one project document.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project found.
        '404':
          description: Unknown project.
  /v1/projects/{projectId}/branches:
    get:
      summary: List a project's branches.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Branch list.
    post:
      summary: Create a branch (409 when the id already exists).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branch' }
      responses:
        '201':
          description: Created.
        '409':
          description: Branch id already exists.
  /v1/projects/{projectId}/snapshots:
    get:
      summary: List snapshots, optionally filtered by branch and time.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: branch
          in: query
          description: Branch id to filter by.
          schema: { type: string }
        - name: since
          in: query
          description: ISO-8601 timestamp; only snapshots created after it.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Snapshot list (newest first).
    post:
      summary: Append a snapshot (409 when the id already exists).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Snapshot' }
      responses:
        '201':
          description: Appended.
        '404':
          description: Unknown branch.
        '409':
          description: Snapshot id already exists — snapshots are append-only.
  /v1/projects/{projectId}/merges:
    post:
      summary: Record a completed merge (the plan, not the act — the client applies the merge locally first).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceBranchId, targetBranchId, appliedChangeIds]
              properties:
                sourceBranchId: { type: string }
                targetBranchId: { type: string }
                appliedChangeIds:
                  type: array
                  items: { type: string }
                leftBehindChangeIds:
                  type: array
                  items: { type: string }
                conflictResolutions:
                  type: object
                  additionalProperties:
                    type: string
                    enum: [source, target]
                author: { type: string }
      responses:
        '201':
          description: Recorded; an activity event is added too.
  /v1/projects/{projectId}/events:
    get:
      summary: List a project's activity events (newest first).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Event list.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Any non-empty token is accepted by the sketch stub.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Workspace:
      type: object
      required: [projects, activity, openProjectId]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        activity:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        openProjectId: { type: string }
    Project:
      type: object
      required: [id, name, kind, subtitle, scenes, branches]
      properties:
        id: { type: string, example: harbour-light }
        name: { type: string, example: Harbour Light }
        kind: { type: string, example: Short film }
        subtitle: { type: string, example: '3:48 · 14 scenes' }
        scenes:
          type: array
          items: { $ref: '#/components/schemas/Scene' }
        branches:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
        isDemo: { type: boolean }
        archived: { type: boolean }
        mergeInReviewSource:
          type: string
          nullable: true
          description: Branch id with a merge into main in review.
    Scene:
      type: object
      required: [number, title]
      properties:
        number: { type: integer, example: 1 }
        title: { type: string, example: Harbour dawn }
    Branch:
      type: object
      required: [id, name, tagline, color, prefix, runtimeSeconds, snapshots]
      properties:
        id: { type: string, example: cinematic }
        name: { type: string, example: cinematic }
        tagline: { type: string }
        color: { type: integer, description: ARGB colour value. }
        prefix: { type: string, example: c }
        forkedFrom:
          type: string
          nullable: true
          description: Snapshot id this branch forked from.
        runtimeSeconds: { type: integer, example: 242 }
        snapshots:
          type: array
          description: Newest first.
          items: { $ref: '#/components/schemas/Snapshot' }
    Snapshot:
      type: object
      required: [id, message, author, createdAt, branchId]
      properties:
        id: { type: string, example: m9 }
        message: { type: string }
        author: { type: string, example: Mara }
        createdAt: { type: string, format: date-time }
        branchId: { type: string, example: main }
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        parentId: { type: string, nullable: true }
        restores:
          type: string
          nullable: true
          description: Snapshot id this restore brings back.
        mergeOf:
          type: string
          nullable: true
          description: Branch id this merge snapshot merged from.
        restoreLabel: { type: string, nullable: true }
    Change:
      type: object
      required: [id, title, detail, meta]
      properties:
        id: { type: string, example: c1-0 }
        title: { type: string, example: Opening shot }
        detail: { type: string, description: Human-language description. }
        meta: { type: string, example: 'Shot replaced · scene 1' }
        scenes:
          type: array
          items: { type: integer }
          description: Every scene the change touches.
        kind:
          type: string
          example: shot
        runtimeDeltaSeconds: { type: integer, example: 2 }
        conflict: { type: boolean }
        conflictNote: { type: string, nullable: true }
        selectedByDefault: { type: boolean, default: true }
    ActivityEvent:
      type: object
      required: [id, kind, text, ref, at]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [branch, merge, restore, snapshot, project]
        text: { type: string }
        ref: { type: string, example: 'm11 · Today 10:04' }
        at: { type: string, format: date-time }
